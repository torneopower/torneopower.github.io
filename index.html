<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torneo Power · Datos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1316;--card:#171d21;--line:#263038;--tx:#eef2f4;--mut:#8a99a3;--c:#1F8EA3;--d:#0C4652;--l:#D3EDF2;--a:#3CC2DA;--warn:#f0b43c}
body.p11{--c:#6E9F1E;--d:#26400A;--l:#E4F0CC;--a:#A6D63F}
body.fem{--c:#C02A7B;--d:#560D35;--l:#F9D8E9;--a:#F25CA8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Barlow,system-ui,sans-serif;font-size:15px}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 60px}
header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--d),var(--bg));padding:14px 14px 0;margin:0 -14px}
.brand{display:flex;align-items:center;gap:10px;padding:0 14px}
.logo{width:38px;height:38px;border-radius:9px;background:var(--c);display:grid;place-items:center;font:italic 800 20px 'Barlow Condensed';transform:skewX(-8deg)}
img.logo{background:none;transform:none;width:44px;height:44px;object-fit:contain;border-radius:0}
.brand h1{margin:0;font:italic 800 24px 'Barlow Condensed';text-transform:uppercase;letter-spacing:.5px}
.brand small{display:block;color:var(--mut);font-size:12px;font-style:normal;font-family:Barlow;letter-spacing:0;text-transform:none}
.tabs{display:flex;margin-top:12px;border-bottom:1px solid var(--line);padding:0 14px}
.tabs button{flex:1;background:none;border:0;color:var(--mut);font:italic 800 18px 'Barlow Condensed';text-transform:uppercase;padding:10px 4px;border-bottom:3px solid transparent;cursor:pointer}
.tabs button.on{color:var(--tx);border-color:var(--a)}
.tabs button[data-t=p7].on{border-color:#3CC2DA}.tabs button[data-t=p11].on{border-color:#A6D63F}.tabs button[data-t=fem].on{border-color:#F25CA8}
.views{display:flex;gap:6px;overflow-x:auto;padding:12px 14px;scrollbar-width:none}
.views::-webkit-scrollbar{display:none}
.chip{flex:none;background:transparent;border:1.5px solid var(--line);color:var(--tx);border-radius:999px;padding:7px 14px;font:600 14px Barlow;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--c);border-color:var(--c)}
.chip .n{background:var(--warn);color:#000;border-radius:9px;padding:0 6px;font-size:11px;margin-left:5px}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 10px}
.sub .chip{padding:5px 12px;font-size:13px}
h2{font:italic 800 22px 'Barlow Condensed';text-transform:uppercase;margin:22px 0 8px;letter-spacing:.3px}
h3{font:italic 800 17px 'Barlow Condensed';text-transform:uppercase;margin:0;color:var(--a);letter-spacing:.3px}
.fh{display:flex;justify-content:space-between;align-items:baseline;background:var(--card);border-radius:10px 10px 0 0;padding:10px 14px;margin-top:16px;border:1px solid var(--line);border-bottom:0}
.fh span{color:var(--mut);font-size:12px}
.match{background:var(--card);border:1px solid var(--line);border-top:0;padding:12px 14px}
.match:last-child{border-radius:0 0 10px 10px}
.meta{color:var(--mut);font-size:12px;text-align:center;margin-bottom:8px}
.row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.tm{display:flex;align-items:center;gap:8px;cursor:pointer;min-width:0}
.tm.r{justify-content:flex-end;text-align:right}
.tm b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.tm.win b{color:var(--a)}
.crest{flex:none;width:30px;height:30px;object-fit:contain}
.panel .hd .crest{width:64px;height:64px}
.badge{flex:none;width:30px;height:30px;border-radius:50%;background:var(--d);border:1.5px solid var(--c);display:grid;place-items:center;font:800 11px 'Barlow Condensed';color:var(--l)}
.sc{font:italic 800 26px 'Barlow Condensed';min-width:70px;text-align:center}
.sc.pend{font-size:17px;color:var(--mut);font-style:normal;font-family:Barlow;font-weight:600}
.det{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px;font-size:13px;line-height:1.55;border-top:1px solid var(--line);padding-top:9px}.det .a{text-align:right}.det .mu{color:var(--mut)}
.tc{display:inline-block;width:10px;height:14px;border-radius:2px;vertical-align:-2px;margin-right:6px;transform:rotate(8deg)}.tc.y{background:#FFD12E}.tc.r{background:#E8263A}
.mvp{margin-top:9px;text-align:center;font-size:13px}
.mvp i{color:var(--warn);font-style:normal}
.note{margin-top:7px;font-size:12px;color:var(--warn);text-align:center}
.src{font-size:11px;color:var(--mut);text-align:center;margin-top:5px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden;font-size:14px}
th{color:var(--mut);font-weight:500;font-size:12px;padding:9px 4px;text-align:center;border-bottom:1px solid var(--line)}
td{padding:9px 4px;text-align:center;border-bottom:1px solid var(--line)}
td.eq{text-align:left;font-weight:600;cursor:pointer}
th.eq{text-align:left}
tr.top td:first-child{box-shadow:inset 3px 0 0 var(--a)}

td.pts{font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.team{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;gap:10px;align-items:center;cursor:pointer;text-align:left;color:var(--tx);font:inherit}
.team:hover{border-color:var(--c)}
.team small{display:block;color:var(--mut);font-size:12px}
.team.miss small{color:var(--warn)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:12px}
.panel .hd{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.panel .hd .crest{flex:none;width:30px;height:30px;object-fit:contain}
.panel .hd .crest{width:64px;height:64px}
.badge{width:46px;height:46px;font-size:15px}
.panel .hd b{font:italic 800 24px 'Barlow Condensed';text-transform:uppercase}
ol.pl{margin:0;padding-left:26px;columns:2;column-gap:20px}
ol.pl li{padding:3px 0;break-inside:avoid}
.ct{margin-top:12px;padding-top:10px;border-top:1px solid var(--line,rgba(127,127,127,.3));display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}.ct b{font-size:13px;text-transform:uppercase;letter-spacing:.02em;color:var(--mut);margin-right:4px}
.back{background:none;border:0;color:var(--a);font:600 14px Barlow;cursor:pointer;padding:0;margin-bottom:6px}
.empty{color:var(--mut);background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:16px;text-align:center}
.list{background:var(--card);border-radius:10px;border:1px solid var(--line)}
.list div{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.list div:last-child{border-bottom:0}
.list span{color:var(--mut)}
.todo li{margin:6px 0}
.todo .w{color:var(--warn)}
.foot{color:var(--mut);font-size:12px;margin-top:30px;text-align:center}
body.cal{--c:#5d6b75;--d:#1b2328;--a:#c9d3d9}
.tabs button[data-t=cal].on{border-color:#fff}
.calhd{display:flex;align-items:center;justify-content:space-between;margin:14px 0 10px}
.calhd h2{margin:0}
.calhd button{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:6px 12px;font:600 14px Barlow;cursor:pointer}
.leg{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-bottom:10px}
.leg span{display:inline-flex;align-items:center;gap:5px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cdow{font:700 11px Barlow;color:var(--mut);text-align:center;padding:4px 0;text-transform:uppercase}
.cday{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:86px;padding:4px;overflow:hidden}
.cday.out{opacity:.3}.cday.today{border-color:#fff}
.cday .n{font:700 12px Barlow;color:var(--mut);margin-bottom:3px}
.ev{border-radius:5px;padding:2px 4px;margin-bottom:3px;font:600 11px/1.2 Barlow;color:#fff;cursor:pointer}.ev:hover{filter:brightness(1.2)}
.fh.flash{outline:2px solid var(--a);outline-offset:2px}
.ev.p7{background:#1F8EA3}.ev.p11{background:#6E9F1E}.ev.fem{background:#C02A7B}
.ev.est{background:transparent!important;border:1.5px dashed;}
.ev.est.p7{border-color:#3CC2DA;color:#9fdeea}.ev.est.p11{border-color:#A6D63F;color:#cfe89a}.ev.est.fem{border-color:#F25CA8;color:#f7a9cf}
.ev.exc{box-shadow:inset 0 0 0 2px #f0b43c}
.ev.done{opacity:.55}
.ev small{display:block;font-weight:500;opacity:.9}
.clist{margin-top:16px}
.pl{cursor:pointer;border-bottom:1px dotted var(--mut)}.pl:hover{color:var(--a);border-color:var(--a)}
.eqf{text-align:center;font-size:14px}.eqf b{color:var(--a);cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}.stats div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;display:block}.stats b{display:block;font:italic 800 28px 'Barlow Condensed'}.stats span{font-size:11px;color:var(--mut)}
@media(max-width:600px){.cday{min-height:64px}.ev small{display:none}.ev{font-size:10px}}
@media(max-width:480px){ol.pl{columns:1}.sc{font-size:22px;min-width:58px}.tm b{font-size:14px}}
/* ===== Vista pública: lo interno solo se ve en modo admin (dueña) ===== */
html:not(.admin) .src,html:not(.admin) .foot,html:not(.admin) .note:not(.pn),html:not(.admin) .adm{display:none!important}
.clasif{font-size:12px;color:var(--mut);text-align:center;margin-top:10px}
.note.pn{color:var(--mut)}
/* ===== Inicio y selector de grupo ===== */
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;margin:16px 0 2px}
.seg button{background:none;border:0;color:var(--mut);font:600 13px Barlow;padding:7px 18px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--c);color:#fff}
.tabs button{flex:1 1 auto;padding:10px 6px}
.hero{padding:24px 2px 4px}.hero h2{font-size:32px;margin:0 0 6px}.hero p{color:var(--mut);margin:0;line-height:1.5}
.tcards{display:grid;gap:12px}
.tcard{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--tc);border-radius:14px;padding:14px 16px}
.tcard{cursor:pointer;transition:border-color .15s,background .15s}.tcard:hover{background:#1c2328;border-color:var(--tc)}
.tcard h3{color:#fff;font-size:21px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.tcard .go{color:var(--tc);font-size:28px;font-style:normal;line-height:1}
.tcard .mu{color:var(--mut);font-size:13px;margin:3px 0}
.tbtn{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tbtn button{background:transparent;border:1px solid var(--line);color:var(--tx);border-radius:999px;padding:6px 14px;font:600 13px Barlow;cursor:pointer}
.tbtn button:first-child{background:var(--tc);border-color:var(--tc)}
.list .sw{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px}
@media(max-width:480px){.tabs button{font-size:14px}}
/* ===== Diseño aireado ===== */
.wrap{padding-bottom:80px}
details.fecha{margin-top:18px}
details.fecha>summary{list-style:none;cursor:pointer;margin-top:0;border:1px solid var(--line);border-radius:12px;user-select:none;padding:12px 14px}
details.fecha>summary::-webkit-details-marker,details.mc>summary::-webkit-details-marker{display:none}
details.fecha>summary h3:before{content:'▸';display:inline-block;margin-right:8px;transition:transform .15s;color:var(--mut);font-style:normal}
details.fecha[open]>summary h3:before{transform:rotate(90deg)}
.fbody{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.fbody .eqf{border:1px solid var(--line);border-radius:14px;margin:0;padding:10px}
details.mc.match{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:8px}
.fbody details.mc.match{margin-top:0}
details.mc>summary{list-style:none;cursor:pointer;user-select:none}
.mc .meta{margin-bottom:10px;letter-spacing:.2px}
.mc .row{gap:12px}
.mc .tm{cursor:inherit}
.mc .tm b{font-size:15px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal}
.mc .sc{font-size:28px}
.more{text-align:center;font-size:11px;color:var(--mut);margin-top:10px;letter-spacing:.3px}
.more:after{content:'Ver detalle ▾'}
details.mc[open] .more:after{content:'Ocultar ▴'}
.det-wrap{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.det-wrap .det{border:0;margin:0;padding:0}
.det .mu{font-size:12px;color:var(--mut)}
.det .tc+.pl,.det .tc+.tc{margin-left:2px}
.mini{font-size:12px;color:var(--mut);text-align:center;margin-top:10px}
.det-wrap .mvp{margin-top:12px}
header .brand{transition:opacity .2s}
header.small .brand{display:none}
header.small{padding-top:6px}
.views{-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent);padding-right:40px}
@media(max-width:600px){.chip{padding:6px 12px;font-size:13px}.tabs button{font-size:16px}.brand h1{font-size:20px}.mc .tm b{font-size:14px}.mc .sc{font-size:24px;min-width:56px}details.mc.match{padding:12px 12px}}
/* ===== Diseño v2 (delicado) ===== */
header{padding-top:10px}
.brand h1{font-size:19px}.logo,img.logo{width:34px;height:34px}
.tabs{margin-top:8px;gap:0;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{font-size:14px;padding:8px 6px;white-space:nowrap}
.views{gap:16px;padding:8px 14px 0;border-bottom:1px solid #1f272d}
.views .chip{background:none!important;border:0;border-radius:0;padding:4px 0 8px;color:var(--mut);font:600 12.5px Barlow;border-bottom:2px solid transparent}
.views .chip.on{color:#fff;border-bottom-color:var(--a)}
.views .chip .n{font-size:10px}
h2{font-size:18px;margin:18px 0 8px}
.strip{display:flex;gap:6px;padding:14px 2px 4px;overflow-x:auto;scrollbar-width:none;align-items:center}
.strip::-webkit-scrollbar{display:none}
.strip .lb{font:600 10px Barlow;color:#6f7e88;letter-spacing:.8px;text-transform:uppercase;margin-right:4px;flex:none}
.strip button{flex:none;min-width:28px;height:28px;padding:0 6px;border-radius:7px;background:none;border:1px solid var(--line);color:#6f7e88;font:600 12px Barlow;cursor:pointer}
.strip button.done{color:#cfd8dc}
.strip button.on{background:#fff;border-color:#fff;color:var(--d);font:italic 800 15px 'Barlow Condensed';transform:skewX(-10deg)}
.fh2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 2px 8px;border-bottom:1px solid #1f272d}
.fh2 b{font:italic 800 16px 'Barlow Condensed';text-transform:uppercase;color:var(--a);letter-spacing:.3px;flex:none}
.fh2 span{font:500 11px Barlow;color:#6f7e88;text-align:right}
.fh2.flash{outline:2px solid var(--a);outline-offset:3px}
.eqf2{font:500 12px Barlow;color:var(--mut);text-align:center;padding:9px 0;border-bottom:1px solid #1f272d}.eqf2 b{color:var(--a);cursor:pointer}
details.m2{border-bottom:1px solid #1f272d;padding:11px 0 9px}
details.m2>summary{list-style:none;cursor:pointer}
details.m2>summary::-webkit-details-marker{display:none}
.m2 .mt{text-align:center;font:500 10.5px Barlow;color:#6f7e88;margin-bottom:6px}
.m2 .rw{display:grid;grid-template-columns:1fr 58px 1fr;align-items:center}
.m2 .tt{display:flex;align-items:center;gap:7px;min-width:0}
.m2 .tt.l{justify-content:flex-end;text-align:right}
.m2 .tt b{font:500 13px Barlow;line-height:1.15}
.m2 .tt.win b{color:var(--a)}
.m2 .crest,.m2 .badge{width:24px;height:24px;flex:none}
.m2 .badge{font-size:9px}
.m2 .rc{width:7px;height:10px;border-radius:1.5px;background:#E8263A;flex:none}
.m2 .sc2{text-align:center}
.m2 .sc2 .n{font:italic 800 21px 'Barlow Condensed';line-height:1}
.m2 .sc2 .n.hr{font-size:17px}.m2 .sc2 .n.vs{font-size:15px;color:#6f7e88}
.m2 .sc2 small{display:block;font:500 9.5px Barlow;color:#6f7e88;margin-top:2px}
.m2 .gg{display:grid;grid-template-columns:1fr 58px 1fr;margin-top:6px;font:400 11px/1.5 Barlow;color:#8a99a3}
.m2 .gg>div{min-width:0}
.m2 .gg .min{color:#5f6d76}
.m2 .gg .rd{display:flex;align-items:center;gap:5px}
.m2 .gg .l .rd{justify-content:flex-end}
.m2 .gg .rc{width:6px;height:9px}
.m2 .rw{grid-template-columns:12px 1fr 58px 1fr 12px}
.m2 .gg{grid-template-columns:12px 1fr 58px 1fr 12px}
.m2 .cs{display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center}
.m2 .cs i{display:block;width:7px;height:10px;border-radius:1.5px;background:#E8263A} .m2 .cs i.y{background:#F5C518}
/* ===== Modo claro (por defecto) ===== */
html:not(.dark){background:#f4f6f7}
html:not(.dark) body{--bg:#f4f6f7;--card:#ffffff;--line:#e2e7ea;--tx:#151a1d;--mut:#6b7780;background:var(--bg);color:var(--tx)}
html:not(.dark) body.p7{--a:#1a7d90}html:not(.dark) body.p11{--a:#557d14}html:not(.dark) body.fem{--a:#b0236e}html:not(.dark) body.cal{--a:#3d4a52}
html:not(.dark) header{background:linear-gradient(180deg,var(--c) 0%,var(--c) 52%,var(--bg) 100%)}
html:not(.dark) .brand h1,html:not(.dark) .tabs button.on{color:#fff}
html:not(.dark) .brand small,html:not(.dark) .tabs button{color:rgba(255,255,255,.8)}
html:not(.dark) .tabs{border-color:rgba(255,255,255,.35)}
html:not(.dark) .tabs button.on{border-color:#fff!important}
html:not(.dark) .views,html:not(.dark) .fh2,html:not(.dark) .eqf2,html:not(.dark) details.m2{border-color:var(--line)}
html:not(.dark) .views .chip.on{color:var(--tx)}
html:not(.dark) .strip button{background:#fff;color:#a3adb4}
html:not(.dark) .strip button.done{color:var(--tx)}
html:not(.dark) .strip button.on{background:var(--c);border-color:var(--c);color:#fff}
html:not(.dark) .m2 .tt.win b{font-weight:600}
html:not(.dark) .m2 .mt,html:not(.dark) .m2 .sc2 small,html:not(.dark) .fh2 span{color:#7d8991}
html:not(.dark) .m2 .gg{color:#55616a}html:not(.dark) .m2 .gg .min{color:#9aa5ad}
html:not(.dark) .m2 .mm{color:#a3adb4}
html:not(.dark) .tcard h3{color:var(--tx)}html:not(.dark) .tcard:hover{background:#eef2f4}
html:not(.dark) .tbtn button:first-child{color:#fff}
html:not(.dark) .note{color:#a86a00}
html:not(.dark) .m2 .dw{border:1px solid var(--line)}
.thbtn{margin-left:auto;flex:none;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.12);color:#fff;font-size:16px;cursor:pointer;display:grid;place-items:center}
.m2 .cc{display:inline-flex;align-items:center;gap:3px;font:500 10px Barlow;color:#6f7e88;flex:none}
.m2 .cc i{display:inline-block;width:6px;height:9px;border-radius:1.5px;margin-left:3px}
.m2 .cc i:first-child{margin-left:0}
.m2 .cc i.y{background:#FFD12E}.m2 .cc i.r{background:#E8263A}
.pl:hover{color:inherit}
@media(hover:hover){.pl:hover{color:var(--a)}}
.m2 .gg .l{text-align:right}
.m2 .gg .pl{border-bottom:0}
.m2 .mm{text-align:center;font:500 10px Barlow;color:#4f5c64;margin-top:4px}
.m2 .mm:after{content:'Tarjetas y detalle ▾'}
.m2[open] .mm:after{content:'Ocultar ▴'}
.m2 .pn2{text-align:center;font:500 10.5px Barlow;color:#8a99a3;margin-top:5px}
.m2 .dw{margin:10px 0 2px;padding:10px 12px;background:var(--card);border-radius:10px;font-size:12px}
.m2 .dw .det{border:0;margin:0;padding:0;font-size:12px}
.m2 .dw .mvp,.m2 .dw .mini{font-size:11.5px;margin-top:8px}
.fempty{color:var(--mut);font-size:12px;text-align:center;padding:18px 0}
/* ===== Goles con pelotita, detalle integrado, ficha liviana ===== */

.tsr{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px}.tsr .lbl{font-weight:400;color:var(--mut);min-width:150px}.posn{font:italic 800 24px 'Barlow Condensed';color:var(--a)}.mut2{color:var(--mut)}.ct b{font-weight:600}span[data-team]{cursor:pointer;transition:color .15s}@media(hover:hover){span[data-team]:hover{color:var(--a)}}

/* Inicio y calendario: color oscuro neutro para que el texto blanco se lea */
html:not(.dark) body.cal{--c:#2f3b44}

html:not(.dark) .views{border-bottom:1px solid var(--line)}
/* Subpestañas: sin el difuminado fijo que cortaba "Info"; solo se difumina si hay más para deslizar */

<body class="p7">
<div class="wrap">
<header>
  <div class="brand"><img class="logo" id="logo" alt="Torneo Power" style="display:none"><div class="logo" id="logotxt">TP</div><h1>Torneo Power <small>Datos de los torneos · @torneopower.vm</small></h1></div>
  <div class="tabs" id="tabs"></div>
  <div class="views" id="views"></div>
</header>
<main id="main"></main>
</div>

<script>
/* ================== DATOS ==================
   Los datos NO están acá: están en datos/p7.json, datos/p11.json, datos/fem.json y datos/cal.json.
   datos/config.json: {"publico":true,"actualizado":"..."} en la versión pública (GitHub). */
let DATA={},CAL=[],CONFIG={},LOADED=false;
let calM=(d=>new Date(d.getFullYear(),d.getMonth(),1))(new Date());

/* ================== APP ================== */
const T=['p7','p11','fem'], V=[['fixture','Fixture'],['posiciones','Posiciones'],['equipos','Equipos'],['goleadores','Goleadores'],['tarjetas','Sanciones'],['faltantes','Falta'],['info','Info']];
let st={t:'inicio',v:'fixture',f:'todos',z:'A',team:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const D=()=>DATA[st.t];
const tm=id=>{const r=D().teams.find(x=>x[0]===id);return r?{id:r[0],n:r[1],z:r[2]}:{id,n:id}};
const ini=n=>n.replace(/^(Esp\.|Coop\.|Las?|Los|El|FC)\s+/i,'').split(/\s+/).filter(w=>w.length>1&&!/^(del|de|la|las|los|el|f\.?c\.?)$/i.test(w)).slice(0,2).map(w=>w[0]).join('').toUpperCase()||n.slice(0,2).toUpperCase();
let CR={};
const CMAP={p7:{},p11:{pasco:'p11_pasco',bandatiti:'p11_bandatiti',rejunte:'p11_rejunte',embajadores:'p11_embajadores',galacticos:'p11_galacticos',notables:'p11_notables',buscas:'p11_buscas',donluis:'p11_donluis',toreros:'p11_toreros',verdaderos:'p11_arroyo',potrero:'p11_potrero',camioneros:'p11_camioneros'},fem:{tigre:'fem_tigre',mamis:'fem_mamis',rojo:'fem_rojo',talento:'fem_talento',reynass:'fem_reynass',gladiadoras:'fem_gladiadoras',tiempo3:'fem_tiempo3',almabrava:'fem_almabrava'}};
const crestKey=id=>{const m=CMAP[st.t]||{};if(id in m)return m[id];return st.t==='p7'?id:null};
const badge=(n,id)=>{const k=id&&crestKey(id);return k&&CR[k]?`<img class="crest" src="${CR[k]}" alt="">`:`<span class="badge">${esc(ini(n))}</span>`};
const DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const fdate=d=>{if(!d)return'';const x=new Date(d+'T12:00');return DIAS[x.getDay()]+' '+x.getDate()+'/'+(x.getMonth()+1)};
const played=m=>m.gh!=null&&m.ga!=null;

function faltantes(t){const d=DATA[t];let n=d.todo.length;return n}

function nav(){
  $('#tabs').innerHTML=`<button data-t="inicio" class="${st.t==='inicio'?'on':''}">Inicio</button>`+T.map(t=>`<button data-t="${t}" class="${t===st.t?'on':''}">${DATA[t].name}</button>`).join('')+`<button data-t="cal" class="${st.t==='cal'?'on':''}">Calendario</button>`;
  if(st.t==='cal'||st.t==='inicio'){$('#views').innerHTML='';document.body.className='cal';return}
  $('#views').innerHTML=V.filter(([k])=>k!=='faltantes'||ADMIN).map(([k,l])=>`<button class="chip ${k===st.v?'on':''}" data-v="${k}">${l}${k==='faltantes'?`<span class="n">${faltantes(st.t)}</span>`:''}</button>`).join('');
  document.body.className=st.t;
}

function zoneChips(){const d=D();if(!d.zonas)return'';return `<div class="seg">${Object.keys(d.zonas).map(z=>`<button class="${st.z===z?'on':''}" data-z="${z}">${d.zonas[z]}</button>`).join('')}</div>`}
function zgChips(){const d=D();if(!d.zonas)return'';const zg=st.zg||'G';return `<div class="sub"><div class="seg"><button class="${zg==='G'?'on':''}" data-zg="G">General</button>${Object.keys(d.zonas).map(z=>`<button class="${zg===z?'on':''}" data-zg="${z}">${d.zonas[z]}</button>`).join('')}</div></div>`}
function inZg(id){const d=D();const zg=st.zg||'G';return !d.zonas||zg==='G'||(tm(id)||{}).z===zg}
function vHome(){
  const hoy=new Date();hoy.setHours(0,0,0,0);const fin=new Date(hoy.getTime()+7*864e5);
  const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const name={p7:'Power 7',p11:'Power 11',fem:'Femenino'},col={p7:'#1F8EA3',p11:'#6E9F1E',fem:'#C02A7B'};
  const D7=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const sem=CAL.filter(e=>e.k!=='est'&&e.d>=iso(hoy)&&e.d<iso(fin)).sort((a,b)=>a.d.localeCompare(b.d));
  let h='<div class="srch"><input id="q" type="search" placeholder="Buscar jugador/a o equipo" autocomplete="off" value="'+esc(st.q||'')+'"><div id="qr">'+(st.q?buscar(st.q):'')+'</div></div>';
  h+='<h2>Esta semana</h2>'+(sem.length?`<div class="list">${sem.map(e=>{const d=new Date(e.d+'T12:00');return `<div data-goto="${e.t}|${e.d}|${esc(e.f)}" style="cursor:pointer"><b><i class="sw" style="background:${col[e.t]}"></i>${D7[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}</b><span>${name[e.t]} · ${esc(e.f)} ›</span></div>`}).join('')}</div>`:'<div class="empty">No hay partidos cargados esta semana.</div>');
  h+='<h2>Torneos</h2><div class="tcards">'+T.map(t=>{const d=DATA[t],ms=d.matches;
    const lastF=[...ms].reverse().find(played);
    const next=ms.find(m=>!played(m)&&!(m.date&&new Date(m.date+'T23:59')<new Date())&&(!lastF||fnumM(m)>=fnumM(lastF)));
    const enJuego=lastF&&next&&next.f===lastF.f;
    const nx=next?`${esc(next.f)}${next.date?' · '+fdate(next.date):''}`:(d.proximas&&d.proximas[0]?`${esc(d.proximas[0][0])} · ${fdate(d.proximas[0][1])}`:'');
    const meta=enJuego?`${esc(lastF.f)} en juego${next.date?' · sigue '+fdate(next.date):''}`:[lastF?'Jugada: '+esc(lastF.f):'',nx?(lastF?'Próxima: ':'Arranca: ')+nx:''].filter(Boolean).join(' · ');
    return `<div class="tcard" data-t="${t}" data-v="fixture" style="--tc:${col[t]}"><div class="tc-top"><h3>${esc(d.full)}</h3><span class="go">›</span></div>${meta?`<div class="mu">${meta}</div>`:''}<div class="tbtn"><button data-t="${t}" data-v="fixture">Fixture</button><button data-t="${t}" data-v="posiciones">Posiciones</button><button data-t="${t}" data-v="goleadores">Goleadores</button></div></div>`}).join('')+'</div>';
  return h;
}

/* ===== Buscador (Inicio) ===== */
const norm=x=>String(x||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
let IDX=null;
function indice(){if(IDX)return IDX;IDX={eq:[],pl:{}};
  T.forEach(t=>{const d=DATA[t],tn=id=>{const r=d.teams.find(x=>x[0]===id);return r?r[1]:''};
    d.teams.forEach(([id,n])=>IDX.eq.push({t,id,n}));
    const put=(n,eq)=>{n=String(n).replace(/^\s*\d+'\s*/,'');const k=pk(n);if(!IDX.pl[k])IDX.pl[k]={k,t,eqs:new Set()};if(eq)IDX.pl[k].eqs.add(d.name+' · '+tn(eq))};
    Object.entries(d.rosters||{}).forEach(([id,r])=>r.p.forEach(p=>put(p,id)));
    d.matches.forEach(m=>['h','a'].forEach(k=>{((m.gol||{})[k]||[]).forEach(n=>put(n,m[k]));((m.tar||{})[k]||[]).forEach(x=>put(x[0],m[k]))}));
    ((d.goleadores||{}).rows||[]).forEach(r=>put(r[0],r[1]));((d.amarillasAcum||{}).rows||[]).forEach(r=>put(r[0],r[1]));(d.sanciones||[]).forEach(x=>put(x.n,x.eq))});
  return IDX}
function buscar(q){q=norm(q).trim();if(q.length<2)return'';const I=indice(),w=q.split(/\s+/),ok=s=>w.every(x=>norm(s).includes(x));
  const eqs=I.eq.filter(x=>ok(x.n)).slice(0,6),pls=Object.values(I.pl).filter(x=>ok(canon(x.k)||x.k)).slice(0,10);
  if(!eqs.length&&!pls.length)return'<div class="qn">Sin resultados</div>';
  return eqs.map(x=>`<div class="qi" data-qt="${x.t}" data-qteam="${x.id}"><b>${esc(x.n)}</b><span>${esc(DATA[x.t].name)} · equipo</span></div>`).join('')
   +pls.map(x=>`<div class="qi" data-qt="${x.t}" data-qpl="${esc(x.k)}"><b>${esc(canon(x.k)||x.k)}</b><span>${esc([...x.eqs].join(' / ')||DATA[x.t].name)}</span></div>`).join('')}
document.addEventListener('input',e=>{if(e.target.id==='q'){st.q=e.target.value;const r=document.getElementById('qr');if(r)r.innerHTML=buscar(st.q)}});
document.addEventListener('click',e=>{const it=e.target.closest('.qi');if(!it)return;e.stopPropagation();
  st.t=it.dataset.qt;st.pl=null;st.team=null;
  if(it.dataset.qpl){st.pl=it.dataset.qpl;st.v='fixture'}else{st.v='equipos';st.team=it.dataset.qteam;const z=tm(st.team).z;if(z)st.z=z}
  window.scrollTo(0,0);render()},true);

function computeTable(ids){
  const d=D(),r={};ids.forEach(i=>r[i]={id:i,pj:0,g:0,e:0,p:0,gf:0,gc:0});
  d.matches.filter(played).forEach(m=>{if(!r[m.h]||!r[m.a])return;const H=r[m.h],A=r[m.a];H.pj++;A.pj++;H.gf+=m.gh;H.gc+=m.ga;A.gf+=m.ga;A.gc+=m.gh;
    if(m.gh>m.ga){H.g++;A.p++}else if(m.gh<m.ga){A.g++;H.p++}else{H.e++;A.e++}});
  const dq=d.descalificados||[];dq.forEach(i=>{if(r[i])Object.assign(r[i],{pj:0,g:0,e:0,p:0,gf:0,gc:0,dq:true})});
  return Object.values(r).map(x=>({...x,pts:x.g*3+x.e,dg:x.gf-x.gc})).sort((a,b)=>(a.dq?1:0)-(b.dq?1:0)||b.pts-a.pts||b.dg-a.dg||b.gf-a.gf||((D().orden||[]).indexOf(a.id)-(D().orden||[]).indexOf(b.id))||tm(a.id).n.localeCompare(tm(b.id).n));
}
function vPos(){
  const d=D();let h='';
  let ids=d.teams.map(t=>t[0]);
  if(d.zonas){h+=`<div class="sub">${zoneChips()}</div>`;ids=d.teams.filter(t=>t[2]===st.z).map(t=>t[0])}
  const rows=computeTable(ids);
  const jugados=rows.some(r=>r.pj>0);
  h+=`<table><tr><th>#</th><th class="eq">Equipo</th><th>PTS</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>DG</th></tr>${rows.map((r,i)=>`<tr class="${i<4&&jugados&&d.zonas?'top':''}"><td>${i+1}</td><td class="eq" data-team="${r.id}">${esc(tm(r.id).n)}${r.dq?' <small style="color:var(--warn)">(descalificado)</small>':''}</td><td class="pts">${r.pts}</td><td>${r.pj}</td><td>${r.g}</td><td>${r.e}</td><td>${r.p}</td><td>${r.gf}</td><td>${r.gc}</td><td>${r.dg>0?'+':''}${r.dg}</td></tr>`).join('')}</table>`;

  function ajusta(){const v=document.getElementById('views'),h=document.querySelector('header');if(!v||!h)return;
    h.style.setProperty('--vh',(v.innerHTML.trim()?v.offsetHeight:0)+'px');
    const on=v.querySelector('.on');if(on){const l=on.offsetLeft,r=l+on.offsetWidth;if(r>v.scrollLeft+v.clientWidth-14||l<v.scrollLeft)v.scrollLeft=Math.max(0,r-v.clientWidth+28)}
    marca(v)}
  function marca(v){v.classList.toggle('mas',v.scrollLeft+v.clientWidth<v.scrollWidth-4)}
  document.addEventListener('scroll',e=>{if(e.target&&e.target.id==='views')marca(e.target)},true);
  window.addEventListener('resize',ajusta);
  window.addEventListener('scroll',()=>setTimeout(()=>{const v=document.getElementById('views'),h=document.querySelector('header');if(v&&h)h.style.setProperty('--vh',(v.innerHTML.trim()?v.offsetHeight:0)+'px')},0),{passive:true});
  ajusta()})();
</script>
</body>
</html>
